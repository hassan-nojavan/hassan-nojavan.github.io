<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hassan Nojavan</title>
  <style>
    :root{
      --ink:#0a2540;
      --muted:#4b5d77;
      --blue:#0f6ab4;
      --rule:#d6e3ff;
      --maxw:1100px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--ink);
      line-height:1.6;
      background:#ffffff;
    }
    .wrap{
      max-width:var(--maxw);
      margin:40px auto;
      padding:0 20px;
      display:grid;
      grid-template-columns: 1fr;
      gap:28px;
    }
    @media (min-width:920px){
      .wrap{grid-template-columns:0.9fr 1.1fr; align-items:start;}
    }
    .left{
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .name{
      font-size:clamp(32px,4.8vw,52px);
      line-height:1.1;
      font-weight:800;
      color:var(--blue);
      margin:0;
    }
    .portrait{
      width:100%;
      aspect-ratio:4/5;
      object-fit:cover;
      border:2px solid var(--rule);
    }
    .right section{margin-bottom:24px}
    h2{
      margin:0 0 12px;
      font-size:clamp(18px,2vw,22px);
      color:var(--blue);
      border-bottom:2px solid var(--rule);
      padding-bottom:6px;
      font-weight:700;
    }
    p{margin:6px 0}
    .muted{color:var(--muted)}
    ul{margin:0; padding-left:18px}
    li{margin:4px 0}
    footer{
      border-top:1px solid var(--rule);
      margin-top:16px;
    }
    .links{
      max-width:var(--maxw);
      margin:0 auto;
      padding:16px 20px 28px;
      text-align:center;
      font-weight:600;
    }
    .links a{
      color:var(--blue);
      text-decoration:none;
    }
    .links a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="left">
      <h1 class="name">Hassan Nojavan</h1>
      <img src="/Hassan1.jpg" alt="Hassan Nojavan" class="portrait">
    </div>

    <div class="right">
      <section>
        <h2>Biography</h2>
        <p class="muted">
          PhD Student in Operations Research at Southern Methodist University (SMU).  
        </p>
      </section>

      <section>
        <h2>Education</h2>
        <ul>
          <li>PhD (Operations Research & Engineering Management), SMU</li>
        </ul>
      </section>

      <section>
        <h2>Research Interests</h2>
        <ul>
        </ul>
      </section>

      <section>
        <h2>Contact</h2>
        <p>Email: <a href="mailto:hnojavan@smu.edu">hnojavan@smu.edu</a></p>
        <p>Dallas, TX</p>
      </section>
    </div>
  </main>

  <footer>
    <div class="links">
      <a href="https://github.com/hassan-nojavan">GitHub</a> •
      <a href="https://www.linkedin.com/in/hassan-nojavan/">LinkedIn</a> •
      <a href="mailto:hnojavan@smu.edu">Email</a>
    </div>
  </footer>
</body>
</html>
